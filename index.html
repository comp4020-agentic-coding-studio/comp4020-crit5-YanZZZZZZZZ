<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>2048</title>
    <meta
      name="description"
      content="A tiny sliding-tile puzzle: merge matching numbers until you run out of room to move."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">2048</a>
      </nav>
      <p id="score" aria-live="polite">0</p>
    </header>
    <main>
      <h1>2048</h1>
      <div id="board" role="img" aria-label="Game board"></div>
      <div id="overlay" hidden>
        <button id="replay" type="button" aria-label="Play again"></button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
